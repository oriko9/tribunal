# Mode B — a separate model per agent.
# Same charge sheet, same prompts. The only thing that changes from mode A is
# which model sits behind each seat. That is what makes the comparison honest.
#
# Paid, as of 2026-09-06. Two live attempts at seven distinct free models both
# failed to reach the judges — see docs/models.md, "Why this project moved off
# the free tier", and the attempt history there for what each one hit. This
# selection pairs the judges, who read the most (the charge sheet and all four
# advocate arguments), with the more capable models; the advocates get lighter
# ones. A live run now costs real money — see runs/ for what it actually cost.
schema_version: 1
mode: multi_model
label: "B — seven prompts, several models"
default_model: "MODEL_ID_TBD"   # multi_model never resolves "default"; every seat below is explicit
agents:
  jon_snow:            { model: "openai/gpt-5-nano" }
  tyrion_lannister:    { model: "openai/gpt-5.4-mini" }
  daenerys_targaryen:  { model: "openai/gpt-oss-120b" }
  grey_worm:           { model: "openai/gpt-oss-20b" }
  judge_barak_model:   { model: "openai/gpt-5.6-luna" }
  judge_elon_model:    { model: "anthropic/claude-haiku-4.5" }
  judge_shamgar_model: { model: "google/gemini-3.1-flash-lite" }
budget:
  max_usd_per_run: 0.50
