# Mode A — one model for all seven agents.
# The only variable that separates the agents here is the prompt.
schema_version: 1
mode: single_model
label: "A — one model, seven prompts"
default_model: "nvidia/nemotron-3-super-120b-a12b:free"   # from docs/free-models.md — 262k context, 235,929 max completion tokens; gemma-4-31b-it and glm-5.2 both hit upstream shared-pool limits
agents:
  jon_snow:            { model: default }
  tyrion_lannister:    { model: default }
  daenerys_targaryen:  { model: default }
  grey_worm:           { model: default }
  judge_barak_model:   { model: default }
  judge_elon_model:    { model: default }
  judge_shamgar_model: { model: default }
budget:
  max_usd_per_run: 0.50
