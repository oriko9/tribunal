# Charge sheet as a SPECIFICATION, not free text.
# Every agent (4 advocates, 3 judges) receives this same structured record.
# Fact IDs (F1..F5) are load-bearing: the verification gate checks that
# every opinion grounds its reasoning in facts that exist here.

schema_version: 1
spec_version: "1.0.0"

case:
  id: T-001
  title: "The Realm v. Jon Snow"
  accused: "Jon Snow"
  deceased: "Daenerys Targaryen"
  act_alleged: >-
    Jon intentionally killed Daenerys by stabbing her during a private meeting
    in the throne room after the fall of King's Landing.

# Shared background so an agent with no knowledge of the story can reason.
# Source: ASE running-project dossier, section 1. 200-300 words.
background: >-
  The story takes place in Westeros, a continent where powerful families compete
  for the Iron Throne. Jon Snow grows up believing he is the illegitimate son of
  Lord Eddard Stark. He becomes a military commander, then King in the North. He
  later learns he is the lawful son of Rhaegar Targaryen and Lyanna Stark, which
  gives him a stronger hereditary claim than Daenerys, although he does not want
  to rule.

  Daenerys Targaryen is the exiled heir of the dynasty that once ruled Westeros.
  She survives abuse, gains three dragons, frees enslaved people, and builds an
  army. Her victories make her both a liberator and an increasingly absolute
  ruler. Jon and Daenerys become allies and lovers while fighting the Night King.
  Jon pledges loyalty to her. After they defeat the dead, Daenerys turns to the
  Iron Throne. Jon's hidden parentage weakens her political claim and feeds her
  fear of betrayal.

  Daenerys attacks King's Landing, held by Queen Cersei Lannister. The city
  surrenders, but Daenerys burns streets and civilians from her dragon, Drogon.
  Jon witnesses the destruction. Afterward she promises further campaigns of
  liberation. Tyrion Lannister, her chief adviser, resigns in protest and is
  imprisoned. He warns Jon that Daenerys will kill anyone who threatens her rule,
  including Jon's sisters. Jon asks Daenerys to show mercy and to share moral
  judgment with others. She refuses. During an embrace, he stabs her to death.
  Her soldiers arrest him.

# Facts neither side disputes. This is the evidentiary universe.
# Nothing outside this list may be treated as established.
agreed_facts:
  - id: F1
    text: >-
      King's Landing had surrendered: its bells rang and organized resistance had
      ceased. Daenerys then used Drogon against streets and civilians, causing
      destruction on a vast scale.
    bears_on: [threat_scale, character_of_the_danger]
  - id: F2
    text: >-
      After the victory, Daenerys told her assembled forces that the campaign of
      "liberation" would continue beyond King's Landing. Jon had seen the city and
      heard the speech.
    bears_on: [threat_scale, imminence, jon_knowledge]
  - id: F3
    text: >-
      Tyrion Lannister renounced his office as Hand and was imprisoned. He warned
      Jon that Daenerys would treat Jon's sisters, and anyone else she regarded as
      an obstacle, as enemies.
    bears_on: [jon_knowledge, defence_of_others]
  - id: F4
    text: >-
      Jon asked Daenerys to forgive Tyrion and to show mercy. She refused to let
      others choose what was good and presented her own judgment as decisive.
    bears_on: [alternatives, imminence]
  - id: F5
    text: >-
      Daenerys was unarmed and was not attacking Jon when he killed her. Jon used
      their intimacy to get close enough to strike. He had not convened a council,
      attempted detention, or sought a public surrender of power.
    bears_on: [alternatives, authority, manner_of_the_act]

question_for_judgment:
  text: >-
    Was Jon Snow's intentional killing of Daenerys Targaryen justified as the
    necessary defense of others and of the realm?
  factors_the_tribunal_must_weigh:
    - id: Q1
      text: "What Jon knew at the time he acted."
    - id: Q2
      text: "The scale of the harm that was threatened."
    - id: Q3
      text: "The absence or presence of safer alternatives."
    - id: Q4
      text: "Jon's lack of formal authority to act."

scope:
  permitted_verdicts: ["justified", "not_justified"]
  the_tribunal_must_not:
    - "impose or recommend a sentence"
    - "combine the three opinions into a single verdict"
    - "declare a majority, a consensus, or an average"
    - "treat any fact not listed in agreed_facts as established"
